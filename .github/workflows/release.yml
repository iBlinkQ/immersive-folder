name: Release plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Provenance is signed with a short-lived OIDC token, and the resulting
  # attestation is written back to the repository. Neither is granted by
  # default, and the attest step fails without both.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      # main.js is a build artefact and stays out of the repo, so the release
      # is the only place it exists. Type-check first: shipping a build that
      # does not compile would be worse than shipping none.
      - name: Type-check and build
        run: npm run build

      - name: Check tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      # Signs a statement that these files came out of this workflow, from this
      # commit. Anyone can then check a downloaded asset against it with
      # `gh attestation verify main.js --repo iBlinkQ/immersive-folder`.
      # Only the two build artefacts are attested: manifest.json ships to the
      # release exactly as it sits in the repository, so its provenance is
      # already the commit history.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
