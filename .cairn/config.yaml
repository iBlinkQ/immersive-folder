version: 0.1
project:
  name: "Immersive Folder"
  summary: "一个 Obsidian 插件：你在哪个文件夹里工作，哪个文件夹就保持可读，文件列表中其余内容全部退到骨架条后面。"
cairn:
  knowledge_dir: "cairn"
  # 本实例初始化（或最近一次升级）所对标的 skill spec 日期，由 init 自动打戳。
  skill_spec_date: "2026-08-07"
  # git_policy: track | ignore | private_sync
  git_policy: "ignore"
  # language: en | zh | ...
  language: "zh"
graduation:
  provider: "obsidian"
  vault: "BlinkObsidianVault"
  target: "30_工程知识库"
  index: "30_工程知识库/INDEX.md"
  link_format: wikilink
history:
  # migration_mode: start_fresh | inventory_only | selective_migrate
  migration_mode: "start_fresh"
